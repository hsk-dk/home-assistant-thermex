name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
version-template: '$MAJOR.$MINOR.$PATCH'

categories:
  - title: '🛠 Breaking Changes'
    labels:
      - 'breaking-change'
      - 'major'
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
      - 'feat'
      - 'feature request'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: '🧰 Maintenance'
    labels:
      - 'chore'
      - 'dependencies'
      - 'maintenance'
      - 'refactor'
  - title: '📚 Documentation'
    labels:
      - 'documentation'
      - 'docs'
  - title: '⚡ Performance'
    labels:
      - 'performance'
      - 'perf'
  - title: '🔒 Security'
    labels:
      - 'security'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels:
      - 'major'
      - 'breaking-change'
  minor:
    labels:
      - 'minor'
      - 'feature'
      - 'enhancement'
  patch:
    labels:
      - 'patch'
      - 'fix'
      - 'bugfix'
      - 'chore'
      - 'dependencies'
      - 'maintenance'
  default: patch

template: |
  ## What's Changed

  $CHANGES

  ## 📈 Statistics
  
  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
  
  ## 🏠 Home Assistant Integration
  
  To install or update this integration:
  
  1. **Marketplace / HACS (Recommended)**:
     - Home Assistant 2026.11 and newer: go to Settings → Marketplace (Updates appear under Settings → Updates)
     - Earlier versions: go to HACS → Integrations
     - Search for "Thermex" and update
  
  2. **Manual Installation**:
     - Download `thermex_api.zip` from this release
     - Extract to `config/custom_components/thermex_api/`
     - Restart Home Assistant
  
  ## 🔧 Configuration
  
  After installation, go to Settings → Devices & Services → Add Integration → Thermex to configure.
  
  ## 📝 Notes
  
  - This release requires Home Assistant Core 2025.8.0 or newer
  - Please restart Home Assistant after updating
  - Make a backup before updating: a release can migrate your config entries, and a migrated entry cannot be downgraded
  - Check the [documentation](https://github.com/$OWNER/$REPOSITORY#readme) for configuration details
  
  ## Say thanks

  <a href="https://www.buymeacoffee.com/hskdk" target="_blank"><img src="https://www.buymeacoffee.com/assets/img/custom_images/orange_img.png" alt="Buy Me A Coffee" style="height: 41px !important;width: 174px !important;box-shadow: 0px 3px 2px 0px rgba(190, 190, 190, 0.5) !important;-webkit-box-shadow: 0px 3px 2px 0px rgba(190, 190, 190, 0.5) !important;" ></a>

exclude-labels:
  - 'skip-changelog'
  - 'duplicate'
  - 'question'
  - 'invalid'
  - 'wontfix'

replacers:
  # Clean up commit messages
  - search: '/^(\w+)(\(.+\))?: (.+)$/'
    replace: '$3'
  # Remove conventional commit prefixes for cleaner display
  - search: '/^(feat|fix|docs|style|refactor|test|chore)(\(.+\))?: /'
    replace: ''

autolabeler:
  - label: 'documentation'
    files:
      - '*.md'
      - 'docs/**/*'
    branch:
      - '/docs?\/.+/'
    title:
      - '/docs?/i'
  - label: 'bug'
    branch:
      - '/fix\/.+/'
    title:
      - '/fix/i'
      - '/bug/i'
  - label: 'feature'
    branch:
      - '/feature\/.+/'
    title:
      - '/feat/i'
      - '/feature/i'
  - label: 'chore'
    branch:
      - '/chore\/.+/'
    title:
      - '/chore/i'
  - label: 'dependencies'
    files:
      - 'requirements.txt'
      - 'custom_components/thermex_api/manifest.json'
    title:
      - '/bump/i'
      - '/update.*dependency/i'
